<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="rim" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#252d4e"/>
      <stop offset="55%" stop-color="#1e2440"/>
      <stop offset="100%" stop-color="#12162a"/>
    </radialGradient>
    <linearGradient id="s1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A40"/>
      <stop offset="100%" stop-color="#F05A22"/>
    </linearGradient>
    <linearGradient id="s2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBC20"/>
      <stop offset="100%" stop-color="#E09B00"/>
    </linearGradient>
    <linearGradient id="s3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28D060"/>
      <stop offset="100%" stop-color="#1EAA4A"/>
    </linearGradient>
    <linearGradient id="s4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A88FF"/>
      <stop offset="100%" stop-color="#1D6AFF"/>
    </linearGradient>
    <linearGradient id="s5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B52FF"/>
      <stop offset="100%" stop-color="#7B2FE0"/>
    </linearGradient>
    <linearGradient id="s6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3E96"/>
      <stop offset="100%" stop-color="#E01B7A"/>
    </linearGradient>
    <radialGradient id="hub" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2a2f52"/>
      <stop offset="70%" stop-color="#1a1f3a"/>
      <stop offset="100%" stop-color="#10142a"/>
    </radialGradient>
  </defs>

  <!-- Outer rim -->
  <circle cx="100" cy="100" r="96" fill="url(#rim)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Wheel slices (6 wedges) -->
  <g stroke="rgba(0,0,0,0.45)" stroke-width="2">
    <path d="M100 100 L100 18 A82 82 0 0 1 171 59 Z" fill="url(#s1)"/>
    <path d="M100 100 L171 59 A82 82 0 0 1 171 141 Z" fill="url(#s2)"/>
    <path d="M100 100 L171 141 A82 82 0 0 1 100 182 Z" fill="url(#s3)"/>
    <path d="M100 100 L100 182 A82 82 0 0 1 29 141 Z" fill="url(#s4)"/>
    <path d="M100 100 L29 141 A82 82 0 0 1 29 59 Z" fill="url(#s5)"/>
    <path d="M100 100 L29 59 A82 82 0 0 1 100 18 Z" fill="url(#s6)"/>
  </g>

  <!-- Pegs -->
  <g fill="#fff9e0" opacity="0.9">
    <circle cx="100" cy="18" r="4.5"/>
    <circle cx="171" cy="59" r="4.5"/>
    <circle cx="171" cy="141" r="4.5"/>
    <circle cx="100" cy="182" r="4.5"/>
    <circle cx="29" cy="141" r="4.5"/>
    <circle cx="29" cy="59" r="4.5"/>
  </g>

  <!-- Center hub -->
  <circle cx="100" cy="100" r="26" fill="url(#hub)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Ticker/pointer at top -->
  <polygon points="100,2 88,26 112,26" fill="#F5A623" stroke="rgba(0,0,0,0.4)" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="100,8 93,22 107,22" fill="#FFD060" opacity="0.6"/>
</svg>
